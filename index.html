<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BNI Anchor Hong Kong member directory — names, professions, companies and business introductions. Traditional Chinese and English, with search and light/dark mode.">
  <title>BNI Anchor 會員名錄</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;600;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#search">Skip to search</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 3v18M7 8h10M5.5 12.5c2.2 1.6 4.4 2.4 6.5 2.4s4.3-.8 6.5-2.4M6 19h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-bni">BNI</span>
          <span class="brand-sub">ANCHOR</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="#members" id="nav-members">會員名單</a>
        <a href="#clients" id="nav-clients">我們的客戶</a>
        <a href="#inquire" id="nav-inquire">查詢</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="lang-btn" type="button">EN</button>
        <button class="icon-btn" id="theme-btn" type="button" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7 4.9 19.1M19.1 4.9l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <p class="kicker" id="kicker">BNI Anchor 香港分會</p>
        <h1 id="headline">Stronger. Bigger. We are <span>Anchor</span>.</h1>
        <p class="hero-lead" id="lead"></p>
        <div class="stats">
          <div class="stat" id="stat-count"></div>
          <div class="stat" id="stat-cats"></div>
          <div class="stat" id="stat-day"></div>
        </div>
      </div>
    </section>

    <section class="banner" aria-label="BNI Anchor chapter photo">
      <img src="images/photos/group.jpg" alt="BNI Anchor 會員大合照" width="1600" height="500">
    </section>

    <section class="toolbar" aria-label="Filters">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="search" type="search" autocomplete="off">
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <section id="members">
      <div class="grid" id="grid" aria-live="polite"></div>
    </section>
    <p class="empty" id="empty" hidden></p>

    <section class="news" id="news">
      <div class="section-inner news-inner">
        <h2 id="news-title">最新動態</h2>
        <figure>
          <img src="images/photos/business-opportunity-day.jpeg" alt="BNI Anchor 商機日 Business Opportunity Day" width="900" height="1200">
        </figure>
      </div>
    </section>

    <section class="clients" id="clients">
      <div class="section-inner">
        <h2 id="clients-title">我們的客戶</h2>
        <div class="client-grid">
          <div class="client-card"><img src="images/clients/waterfall.png" alt="Waterfall"></div>
          <div class="client-card"><img src="images/clients/davis-polk.jpg" alt="Davis Polk"></div>
          <div class="client-card"><img src="images/clients/mtr.jpg" alt="MTR"></div>
          <div class="client-card"><img src="images/clients/chubb.jpg" alt="Chubb 安達人壽"></div>
          <div class="client-card"><img src="images/clients/citibank.jpg" alt="Citibank"></div>
          <div class="client-card"><img src="images/clients/fitness-247.jpeg" alt="24/7 Fitness"></div>
          <div class="client-card"><img src="images/clients/snap-fitness.jpg" alt="Snap Fitness 24/7"></div>
          <div class="client-card"><img src="images/clients/axa.jpg" alt="AXA 安盛"></div>
          <div class="client-card"><img src="images/clients/hktvmall.png" alt="HKTVmall"></div>
          <div class="client-card"><img src="images/clients/lung-fung.jpeg" alt="龍豐集團 Lung Fung Group"></div>
          <div class="client-card"><img src="images/clients/tapngo.jpg" alt="Tap &amp; Go"></div>
          <div class="client-card"><img src="images/clients/kpay.png" alt="KPay"></div>
          <div class="client-card"><img src="images/clients/hsbc.png" alt="HSBC 滙豐"></div>
        </div>
      </div>
    </section>

    <section class="inquire" id="inquire">
      <div class="section-inner inquire-inner">
        <div>
          <p class="inquire-kicker" id="inquire-chapter">BNI Anchor 分會</p>
          <h2 id="inquire-title">查詢</h2>
          <form id="inquire-form" novalidate>
            <label for="inq-first" id="label-first">名字</label>
            <input id="inq-first" name="firstName" type="text" autocomplete="given-name" required>

            <label for="inq-last" id="label-last">姓氏</label>
            <input id="inq-last" name="lastName" type="text" autocomplete="family-name" required>

            <label for="inq-phone" id="label-phone">電話</label>
            <input id="inq-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+852" required>

            <label for="inq-email" id="label-email">電子郵件</label>
            <input id="inq-email" name="email" type="email" autocomplete="email" required>

            <label for="inq-industry" id="label-industry">公司行業</label>
            <input id="inq-industry" name="industry" type="text" autocomplete="organization-title" required>

            <button type="submit" id="inquire-submit">提交，想來一次商務會議</button>
            <p class="inquire-note" id="inquire-note"></p>
          </form>
        </div>
        <img class="inquire-badge" src="images/photos/anchor-badge.png" alt="BNI Anchor EST. 2025 — Stronger! Bigger!">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p id="footer-copy"></p>
      <p>
        <a id="ig-link" href="https://www.instagram.com/bni.anchor.hk" target="_blank" rel="noreferrer">Instagram</a>
        ·
        <a href="https://www.bni-anchor.com/">bni-anchor.com</a>
      </p>
    </div>
  </footer>

  <div class="modal" id="modal" hidden></div>

  <script src="js/members.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
